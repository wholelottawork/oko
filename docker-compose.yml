x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  oko:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: oko-trading
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      TZ: ${OKO_TIMEZONE:-Etc/UTC}
      API_SERVER_PORT: 8080
      AI_MAX_TOKENS: 8000
    security_opt:
      - no-new-privileges:true
    networks:
      - oko-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  oko-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: oko-frontend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${OKO_FRONTEND_PORT:-3000}:80"
    security_opt:
      - no-new-privileges:true
    networks:
      - oko-network
    depends_on:
      oko:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging: *default-logging

networks:
  oko-network:
    driver: bridge
