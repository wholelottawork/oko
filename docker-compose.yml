services:
  # Backend service (API and core logic)
  oko:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: oko-trading
    restart: unless-stopped
    stop_grace_period: 30s  # Allow up to 30 seconds for graceful shutdown
    ports:
      - "${OKO_BACKEND_PORT:-8080}:8080"
      - "6060:6060"  # pprof profiling
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
    networks:
      - oko-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  oko-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: oko-frontend
    restart: unless-stopped
    ports:
      - "${OKO_FRONTEND_PORT:-3000}:80"
    networks:
      - oko-network
    depends_on:
      - oko
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  oko-network:
    driver: bridge
